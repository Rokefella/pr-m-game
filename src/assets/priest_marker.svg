      0%, 100% { opacity: 0.85; transform: scale(0.97); }
      50% { opacity: 1; transform: scale(1.04); }
    }
  </style>
  <defs>
    <radialGradient id="glow-priest" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4d8" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#d4b85f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d4b85f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body-priest" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0e8c8"/>
      <stop offset="45%" stop-color="#d4b85f"/>
      <stop offset="100%" stop-color="#5a4a2a"/>
    </radialGradient>
  </defs>
  <g class="flame-pulse">
    <circle cx="12" cy="12" r="11" fill="url(#glow-priest)"/>
    <path d="M12,4 C15,6 16.5,9 15,12.5 C14,15 12.8,15.5 12,16 C11.2,15.5 10,15 9,12.5 C7.5,9 9,6 12,4 Z"
          fill="url(#body-priest)" stroke="rgba(255,255,255,0.3)" stroke-width="0.3"/>
    <path d="M12,7 C13.3,8.2 13.8,9.8 13,11.5 C12.5,12.6 12.2,12.9 12,13.1 C11.8,12.9 11.5,12.6 11,11.5 C10.2,9.8 10.7,8.2 12,7 Z"
          fill="#fff4d8" fill-opacity="0.5"/>
    <circle cx="10.7" cy="10.5" r="0.55" fill="#fff4d8"/>
    <circle cx="13.3" cy="10.5" r="0.55" fill="#fff4d8"/>
    <path d="M12,20 C10.5,20 10,18.8 11,18.2 C11.8,17.7 12.8,18.2 12.5,19 C12.3,19.5 11.7,19.5 11.7,19" fill="none" stroke="#d4b85f" stroke-width="0.4"/>
