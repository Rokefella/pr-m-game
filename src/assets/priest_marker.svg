<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24">
  <style>
    .flame-pulse { animation: flamePulse-priest 3.6s ease-in-out infinite; transform-origin: 12px 12px; }
