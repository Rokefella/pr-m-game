<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24">
  <style>
    .coin-spin { animation: bankerCoinSpin 5s ease-in-out infinite; transform-origin: 12px 11px; }
    .ledger-glow { animation: bankerLedgerGlow 4.2s ease-in-out infinite; transform-origin: 12px 12px; }
    @keyframes bankerCoinSpin {
      0%, 100% { transform: scaleX(1); opacity: 0.9; }
      45% { transform: scaleX(0.25); opacity: 1; }
      50% { transform: scaleX(0.1); opacity: 0.75; }
      55% { transform: scaleX(0.25); opacity: 1; }
    }
    @keyframes bankerLedgerGlow {
      0%, 100% { opacity: 0.8; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.03); }
    }
  </style>
  <defs>
    <radialGradient id="bankGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8cf7a" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#1a9e7a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1a9e7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bankCoin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2dc9a"/>
      <stop offset="50%" stop-color="#c8943a"/>
      <stop offset="100%" stop-color="#7c5a1e"/>
    </linearGradient>
  </defs>
  <g class="ledger-glow">
    <circle cx="12" cy="12" r="11" fill="url(#bankGlow)"/>
    <!-- ledger / vault body -->
    <rect x="6.4" y="13.4" width="11.2" height="6.4" fill="#153f37" stroke="rgba(200,148,58,0.5)" stroke-width="0.35"/>
    <line x1="7.4" y1="15.4" x2="16.6" y2="15.4" stroke="rgba(232,207,122,0.35)" stroke-width="0.3"/>
    <line x1="7.4" y1="17" x2="16.6" y2="17" stroke="rgba(232,207,122,0.28)" stroke-width="0.3"/>
    <line x1="7.4" y1="18.6" x2="13.5" y2="18.6" stroke="rgba(232,207,122,0.22)" stroke-width="0.3"/>
    <!-- scales beam -->
    <line x1="5.2" y1="12.4" x2="18.8" y2="12.4" stroke="#c8943a" stroke-width="0.45"/>
  </g>
  <g class="coin-spin">
    <circle cx="12" cy="8.4" r="4" fill="url(#bankCoin)" stroke="#f2dc9a" stroke-width="0.3"/>
    <circle cx="12" cy="8.4" r="2.6" fill="none" stroke="rgba(60,40,10,0.45)" stroke-width="0.3"/>
    <path d="M11.1,6.7 L12.9,6.7 M12,6.7 L12,10.1 M11.1,10.1 L12.9,10.1 M10.6,8.4 L13.4,8.4"
          stroke="rgba(50,34,8,0.7)" stroke-width="0.45" stroke-linecap="round"/>
  </g>
</svg>
