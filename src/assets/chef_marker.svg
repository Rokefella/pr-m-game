<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24">
  <style>
    .flame-pulse { animation: flamePulse-chef 3.6s ease-in-out infinite; transform-origin: 12px 12px; }
    @keyframes flamePulse-chef {
      0%, 100% { opacity: 0.85; transform: scale(0.97); }
      50% { opacity: 1; transform: scale(1.04); }
    }
  </style>
  <defs>
    <radialGradient id="glow-chef" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd88a" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#d4573d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d4573d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body-chef" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0b8a8"/>
      <stop offset="45%" stop-color="#d4573d"/>
      <stop offset="100%" stop-color="#5a2318"/>
    </radialGradient>
  </defs>
  <g class="flame-pulse">
    <circle cx="12" cy="12" r="11" fill="url(#glow-chef)"/>
    <path d="M12,4 C15,6 16.5,9 15,12.5 C14,15 12.8,15.5 12,16 C11.2,15.5 10,15 9,12.5 C7.5,9 9,6 12,4 Z"
          fill="url(#body-chef)" stroke="rgba(255,255,255,0.3)" stroke-width="0.3"/>
    <path d="M12,7 C13.3,8.2 13.8,9.8 13,11.5 C12.5,12.6 12.2,12.9 12,13.1 C11.8,12.9 11.5,12.6 11,11.5 C10.2,9.8 10.7,8.2 12,7 Z"
          fill="#ffd88a" fill-opacity="0.5"/>
    <circle cx="10.7" cy="10.5" r="0.55" fill="#ffd88a"/>
    <circle cx="13.3" cy="10.5" r="0.55" fill="#ffd88a"/>
    <path d="M10.5,20 L13,17.5 L13.6,18.1 L11.1,20.6 Z" fill="#d4573d"/><line x1="10.3" y1="20.2" x2="9.6" y2="20.9" stroke="#d4573d" stroke-width="0.5"/>
  </g>
</svg>
